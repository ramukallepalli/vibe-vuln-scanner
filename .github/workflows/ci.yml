name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

      - name: Validate manifest.json
        run: |
          node -e "
          const fs = require('fs');
          try {
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (!manifest.manifest_version || !manifest.name || !manifest.version) {
              throw new Error('Invalid manifest.json: missing required fields');
            }
            console.log('✓ manifest.json is valid');
            console.log('  Name:', manifest.name);
            console.log('  Version:', manifest.version);
            console.log('  Manifest Version:', manifest.manifest_version);
          } catch (error) {
            console.error('✗ manifest.json validation failed:', error.message);
            process.exit(1);
          }
          "

      - name: Check required files
        run: |
          required_files="LICENSE README.md CONTRIBUTING.md package.json manifest.json"
          missing_files=""
          for file in $required_files; do
            if [ ! -f "$file" ]; then
              missing_files="$missing_files $file"
            fi
          done
          if [ -n "$missing_files" ]; then
            echo "✗ Missing required files:$missing_files"
            exit 1
          fi
          echo "✓ All required files present"

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: web-ext-artifacts/*.zip
          retention-days: 30
